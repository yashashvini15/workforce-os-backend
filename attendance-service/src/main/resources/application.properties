spring.application.name=attendance-service
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=tempDevSecretKeyForJwtSigning123456789ABCDEF
jwt.expiration=86400000

# Office Geofence Config
office.latitude=22.749663
office.longitude=75.895411
office.geofence.radius-meters=100
office.wifi.ssid=Office_5G
office.start-time=09:30
office.late-threshold-minutes=15