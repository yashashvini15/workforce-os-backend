spring.application.name=attendance-service
server.port=${PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=tempDevSecretKeyForJwtSigning123456789ABCDEF
jwt.expiration=86400000

# Office Geofence Config
office.latitude=${OFFICE_LATITUDE}
office.longitude=${OFFICE_LONGITUDE}
office.geofence.radius-meters=${OFFICE_GEOFENCE_RADIUS:100}
office.wifi.ssid=${OFFICE_WIFI_SSID}
office.start-time=${OFFICE_START_TIME:09:30}
office.late-threshold-minutes=${OFFICE_LATE_THRESHOLD:15}